__SHARED_CSS__

/* ══════════════ 磁贴式布局（玻璃 Metro 版） ══════════════
   保留 Metro 式错落排布，但磁贴使用主色晕染 + 毛玻璃反光，
   避免原来大块纯色带来的卡通感。 */

#home {
    padding: 48px 0 0;
    align-items: stretch;
}

/* 顶部小时钟问候区 */
#cw { text-align:center; padding:8px 20px 18px; flex-shrink:0; }
#cwGreeting { font-size:13px; color:var(--text-secondary); margin-bottom:4px; font-weight:500; letter-spacing:1px; }
#cwTime {
    font-size:42px; font-weight:300; letter-spacing:-1px; line-height:1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(to bottom, var(--clock-gradient-top) 0%, var(--clock-gradient-bottom) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15)) drop-shadow(0 0 20px var(--clock-glow));
}
#cwDate { font-size:12px; color:var(--text-secondary); margin-top:6px; font-weight:500; letter-spacing:0.5px; }

/* 磁贴网格容器：响应式列数，铺满可用宽度 */
#tiles {
    flex:1; overflow-y:auto; overflow-x:hidden;
    display:grid;
    grid-template-columns: repeat(var(--cols, 6), 120px);
    grid-auto-rows: 120px;
    gap:8px;
    justify-content:center;
    align-content:start;
    padding:8px 28px 80px;
    touch-action:pan-y;
}

/* 磁贴基类：主色晕染 + 毛玻璃 */
.icon {
    position:relative; overflow:hidden; cursor:pointer;
    border-radius:10px;
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    background:
        radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--c) 60%, transparent) 0%, transparent 55%),
        linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.03) 100%),
        color-mix(in srgb, var(--c) 22%, rgba(40,44,52,0.45));
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.12);
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
    user-select:none;
}
.icon::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    transform: skewX(-25deg); transition: left 0.6s;
}
.icon:hover::before { left: 150%; }
/* 大磁贴 2x2：dock 应用 */
.icon.lg { grid-row:span 2; grid-column:span 2; border-radius:14px; }
/* 中磁贴 2x1：系统应用 */
.icon.md { grid-column:span 2; }

/* 居中大图标 */
.icon .ic {
    font-size:34px; line-height:1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    pointer-events:none;
}
.icon.lg .ic { font-size:72px; }
.icon.md .ic { font-size:46px; }

/* 底部白色名称 */
.icon .name {
    position:absolute; left:10px; right:10px; bottom:7px;
    font-size:12px; color:#fff; font-weight:500;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-align:center;
    pointer-events:none;
}
.icon.lg .name { font-size:15px; left:14px; right:14px; bottom:14px; }

/* hover：轻微上浮 + 光晕 */
.icon:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(0,0,0,0.28), 0 0 32px color-mix(in srgb, var(--c) 28%, transparent), inset 0 1px 0 rgba(255,255,255,0.18);
    z-index:2;
}
.icon:active { transform: scale(0.97); transition: transform 0.08s; }

/* 运行中：右上角小白点 */
.icon.running::after {
    content:""; position:absolute; top:8px; right:8px;
    width:8px; height:8px; border-radius:50%;
    background:#fff; box-shadow: 0 0 8px rgba(255,255,255,0.9);
    z-index:3;
}
.icon.lg.running::after { width:11px; height:11px; top:12px; right:12px; }
</style>

<script>
/* ══════════════ 磁贴式布局专属 JS ══════════════ */

/* 磁贴列数参数 */
const METRO={TILE:120, GAP:8, PAD_X:28};

/* 根据 APPS 渲染磁贴：
   - dock 应用 → 大磁贴 2x2（置顶）
   - 系统应用 → 中磁贴 2x1（横向）
   - 普通应用 → 小磁贴 1x1
   _shared.js 在 poll().then() 后会自动调用 buildHome()。 */
function buildHome(){
  const box=$('tiles'); if(!box)return;
  const cols=Math.max(2, Math.floor((box.clientWidth-METRO.PAD_X*2+METRO.GAP)/(METRO.TILE+METRO.GAP)));
  box.style.setProperty('--cols', cols);
  box.innerHTML='';

  APPS.filter(a=>a.dock).forEach(a=>box.appendChild(tileEl(a,'lg')));
  APPS.filter(a=>a.system && !a.dock).forEach(a=>box.appendChild(tileEl(a,'md')));
  APPS.filter(a=>!a.dock && !a.system).forEach(a=>box.appendChild(tileEl(a,'')));

  if(typeof updateDots==='function')updateDots();
}

/* 构造单个磁贴：class="icon[ lg|md]" data-id=应用id，inline 设置 --c 为应用 color */
function tileEl(a, size){
  const d=document.createElement('div');
  d.className='icon'+(size?(' '+size):'');
  d.dataset.id=a.id;
  d.style.setProperty('--c', a.color||'#555');
  if(a.system)d.classList.add('system');
  d.innerHTML='<span class="ic">'+a.icon+'</span><span class="name">'+esc(a.name)+'</span>';
  return d;
}

/* 运行状态：给运行中磁贴加 .running 类（右上角小白点） */
function updateDots(){
  const run={};APPS.forEach(a=>run[a.id]=a.running);
  document.querySelectorAll('#tiles .icon').forEach(el=>{
    el.classList.toggle('running',!!run[el.dataset.id]);
  });
}

/* 窗口尺寸变化时重建（保持网格列数自适应） */
addEventListener('resize',()=>{ if(typeof buildHome==='function')buildHome(); });
</script></body></html>
