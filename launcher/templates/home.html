<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>__TITLE__</title>
<style>
/* ── 旗舰级毛玻璃拟态变量 ── */
:root {
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-bg-hover: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-border-hover: rgba(255, 255, 255, 0.2);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #818cf8;
    --accent-glow: rgba(129, 140, 248, 0.4);
    --success: #34d399;
    --danger: #f87171;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text-primary);
    user-select: none;
    background-color: #0b1120;
    background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(34, 211, 238, 0.2) 0px, transparent 50%);
    background-size: 200% 200%;
    animation: aurora 25s ease infinite;
}
@keyframes aurora {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
*:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); }

/* ── 顶部状态栏 ── */
#statusbar {
    position:fixed; top:0; left:0; right:0; height:32px; z-index:90;
    display:flex; justify-content:space-between; align-items:center; padding:0 24px;
    font-size:12.5px; font-weight:500; pointer-events:auto;
    background: rgba(11, 17, 32, 0.6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--glass-border);
}
.sbR { display:flex; align-items:center; gap:12px; }

#gearBtn {
    background:transparent; border:1px solid transparent; color:var(--text-primary);
    cursor:pointer; font-size:14px; padding:4px 8px; border-radius:6px; transition:all 0.2s ease;
}
#gearBtn:hover { background:var(--glass-bg-hover); border-color:var(--glass-border-hover); }
#gearBtn.hasUpdate::after {
    content:""; display:inline-block; width:6px; height:6px; margin-left:2px;
    background:var(--danger); border-radius:50%; vertical-align:top;
    box-shadow: 0 0 6px var(--danger);
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }

#netIcon { width:15px; height:15px; color:var(--text-secondary); }
#netIcon .slash { display:none; }
#netIcon.off .slash { display:block; }
#netIcon.off .arc { opacity:0.3; }

#batt { width:22px; height:11px; border:1.5px solid var(--text-secondary); border-radius:3px; position:relative; }
#batt i { position:absolute; inset:1.5px; background:var(--success); border-radius:1.5px; transition:width 0.3s ease; }
#batt b { position:absolute; right:-4px; top:2px; width:2px; height:5px; background:var(--text-secondary); border-radius:1px; }

/* ── 主桌面区域 ── */
#home {
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:60px 0 0; transition:transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s, filter 0.35s;
    touch-action:none;
}
#home.dim { opacity:0; transform:scale(1.05); pointer-events:none; filter:blur(10px); }

/*  放大版时钟与问候区 */
#cw { text-align:center; margin-bottom:60px; padding:0 20px; }
#cwGreeting { font-size:16px; color:var(--text-secondary); margin-bottom:8px; font-weight:500; letter-spacing:1px; }
#cwTime {
    font-size:76px; font-weight:200; letter-spacing:-2px; line-height:1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(to bottom, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.2));
}
#cwDate { font-size:15px; color:var(--text-secondary); margin-top:10px; font-weight:500; }

#pager { flex:1; overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
#screens { display:flex; height:100%; transition:transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }

/* 🌟 核心布局优化：超大间距响应式网格 */
.screen {
    flex:0 0 100%; 
    display:grid; 
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap:60px 32px; 
    align-content: center; 
    justify-items: center;
    max-width: 1000px; 
    margin: 0 auto; 
    padding: 0 40px;
}

.icon { display:flex; flex-direction:column; align-items:center; gap:14px; cursor:pointer; position:relative; width:110px; }
.tile {
    position:relative; width:84px; height:84px; border-radius:22px; font-size:38px;
    display:flex; align-items:center; justify-content:center;
    background: var(--glass-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
}
.tile::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: skewX(-25deg); transition: left 0.5s;
}
.icon:hover .tile::before { left: 150%; }
.icon:hover .tile {
    background: var(--glass-bg-hover);
    border-color: var(--glass-border-hover);
    transform: translateY(-8px) scale(1.05);
    box-shadow: 0 24px 36px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.icon:active .tile { transform: scale(0.95); transition: transform 0.1s; }

.name {
    font-size:14px; color:var(--text-primary); width:100%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; text-align:center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5); padding: 0 4px;
    font-weight: 500; letter-spacing: 0.5px;
}
.tile.running::after {
    content:""; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%; background:var(--success);
    box-shadow: 0 0 10px var(--success);
}
.tile.system::before {
    content:""; position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%;
    background:var(--accent); box-shadow: 0 0 10px var(--accent-glow); z-index: 2;
}

/* 优化的分页指示器 */
#dots { display:flex; justify-content:center; gap:8px; padding:28px 0 24px; }
#dots i { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.2); transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
#dots i.on { background:#fff; width:28px; border-radius:3px; box-shadow:0 0 12px rgba(255,255,255,0.5); }

/* 🌟 放大版 Dock 栏 */
#dock {
    margin:0 auto 40px; height:92px; border-radius:26px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    display:flex; align-items:center; justify-content:center; gap: 20px;
    padding: 0 24px;
    max-width: 90%;
}
#dock .icon { width: auto; }
#dock .tile { width:68px; height:68px; font-size:34px; border-radius:18px; }
#dock .icon:hover .tile { transform: translateY(-12px) scale(1.25); } /* 更夸张的悬停放大 */
#dock .name { display:none; }

/* ── 最近任务面板 ── */
.panel {
    position:fixed; inset:0; z-index:60;
    background: rgba(11, 17, 32, 0.75);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    transform:translateY(100%); transition:transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    display:flex; flex-direction:column; padding:48px 0 24px;
    border-top: 1px solid var(--glass-border);
}
.panel.show { transform:translateY(0); }
.pHead { display:flex; justify-content:space-between; align-items:center; padding:0 28px 16px; font-size:15px; font-weight:600; }
.pHead span { display:flex; gap:10px; }
.pHead button {
    background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--text-primary);
    border-radius:8px; padding:6px 14px; cursor:pointer; font-size:12px; transition:all 0.2s;
}
.pHead button:hover { background:var(--glass-bg-hover); border-color:var(--glass-border-hover); }

#rCards { flex:1; display:flex; gap:24px; overflow-x:auto; padding:10px 28px; align-items:center; touch-action:pan-x; }
.card {
    position:relative; flex:0 0 160px; height:220px; border-radius:22px;
    background: var(--glass-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    cursor:pointer; transition:all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); touch-action:none;
    overflow: hidden;
}
.card::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: skewX(-25deg); transition: left 0.6s;
}
.card:hover::before { left: 150%; }
.card:hover { background: var(--glass-bg-hover); transform: translateY(-4px); border-color: var(--glass-border-hover); }
.card.fadeOut { opacity:0; transform:translateY(-80px) scale(0.85)!important; pointer-events:none; }
.card .x {
    position:absolute; top:12px; right:14px; background:none; border:none; color:var(--text-secondary);
    font-size:18px; cursor:pointer; transition:all 0.2s; z-index: 2;
}
.card .x:hover { color:var(--danger); transform: scale(1.1); }
.card .st { font-size:12px; color:var(--text-secondary); }
.rTip { text-align:center; color:var(--text-secondary); font-size:13px; padding-top:20px; }
.rEmpty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); font-size:15px; }

/* ── 应用页面 ── */
.page {
    position:absolute; inset:0; background:rgba(11, 17, 32, 0.96); display:none; flex-direction:column;
    z-index:40; padding-top:32px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.page.show { display:flex; animation:op 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes op { from { transform:scale(0.96) translateY(10px); opacity:0; } }
.bar {
    height:46px; background:rgba(255,255,255,0.04); color:var(--text-primary);
    display:flex; align-items:center; justify-content:space-between; padding:0 18px;
    font-size:14px; font-weight:500; border-bottom: 1px solid var(--glass-border);
}
.bar button {
    background:transparent; border:1px solid var(--glass-border); color:var(--text-primary);
    font-size:13px; cursor:pointer; padding:6px 12px; border-radius:8px; transition:all 0.2s;
}
.bar button:hover { background:var(--glass-bg-hover); border-color:var(--glass-border-hover); }
.page iframe { flex:1; border:0; width:100%; background: #fff; }
.loading {
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary); font-size:15px;
    animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.gz { position:absolute; left:0; right:0; bottom:0; height:16px; z-index:5; }

#homeBar {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    width:130px; height:5px; border-radius:3px;
    background: rgba(255,255,255,0.3);
    z-index:99; cursor:pointer; transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#homeBar:hover { background: rgba(255,255,255,0.6); width: 150px; box-shadow: 0 0 12px rgba(255,255,255,0.3); }

/* ── 关于模态 ── */
.modalMask {
    position:fixed; inset:0; z-index:200;
    background:rgba(0, 0, 0, 0.6);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; padding:24px;
}
.modalMask.show { display:flex; animation:fade 0.25s ease; }
@keyframes fade { from { opacity:0; } }
.modal {
    width:min(540px,92vw); max-height:86vh;
    background: rgba(20, 25, 45, 0.8);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding:26px;
    display:flex; flex-direction:column; gap:18px;
    color:var(--text-primary);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.08);
}
.modal h2 { font-size:19px; font-weight:600; display:flex; align-items:center; gap:12px; }
.modal .ver { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-secondary); font-variant-numeric: tabular-nums; }
.modal .logoRow { display:flex; gap:18px; align-items:center; }
.modal .logoBig {
    width:60px; height:60px; border-radius:16px; font-size:30px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,255,0.08);
}
.modal .cl {
    background:rgba(0, 0, 0, 0.2);
    border: 1px solid var(--glass-border);
    border-radius:12px;
    padding:14px 18px;
    max-height:260px; overflow:auto;
    font-size:13px; line-height:1.7;
    color: var(--text-secondary);
}
.modal .cl ul { padding-left:18px; }
.modal .foot { display:flex; justify-content:flex-end; gap:12px; margin-top:auto; }
.modal button { padding:9px 18px; border-radius:10px; border:0; cursor:pointer; font-size:13px; font-weight:600; transition:all 0.2s; }
.btnPri { background: var(--accent); color: #fff; box-shadow: 0 4px 12px var(--accent-glow); }
.btnPri:hover { background: #6366f1; transform:translateY(-1px); box-shadow: 0 6px 16px var(--accent-glow); }
.btnDef { background: transparent; color: var(--text-secondary); border: 1px solid var(--glass-border); }
.btnDef:hover { background:var(--glass-bg-hover); color:var(--text-primary); border-color:var(--glass-border-hover); }
.updHint { padding:14px; border-radius:12px; font-size:13px; line-height:1.6; border:1px solid transparent; }
.updHint.ok { background:rgba(52, 211, 153, 0.1); color:var(--success); border-color:rgba(52, 211, 153, 0.2); }
.updHint.up { background:rgba(248, 113, 113, 0.1); color:var(--danger); border-color:rgba(248, 113, 113, 0.2); }

/* ── Toast ── */
.__toast {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:9999;
    padding:12px 22px;
    background: rgba(20, 25, 45, 0.9);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: var(--text-primary);
    border-radius:14px;
    font-size:14px; font-weight:500;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    animation:fade 0.15s, pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pop { from { transform:translate(-50%,-50%) scale(0.9); opacity:0; } }
</style></head><body>

<div id="statusbar">
  <span id="sbTime" style="font-variant-numeric: tabular-nums;">--:--</span>
  <span class="sbR">
    <button id="gearBtn" title="关于 / 系统更新">⚙️</button>
    <svg id="netIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path class="arc" d="M2 8.5C5 5.9 8.4 4.5 12 4.5s7 1.4 10 4"/>
      <path class="arc" d="M5.5 12.5c2-1.8 4.2-2.7 6.5-2.7s4.5.9 6.5 2.7"/>
      <path class="arc" d="M9 16.3c1-.9 2-1.3 3-1.3s2 .4 3 1.3"/>
      <circle cx="12" cy="19.5" r="1.8" fill="currentColor" stroke="none"/>
      <path class="slash" d="M4 4l16 16"/>
    </svg>
    <span id="batt"><i id="battFill"></i><b></b></span><span id="battPct" style="font-size:11px;margin-left:4px;color:var(--text-secondary);font-variant-numeric:tabular-nums;"></span>
  </span>
</div>

<div id="home">
  <div id="cw">
    <div id="cwGreeting">欢迎使用</div>
    <div id="cwTime">--:--</div>
    <div id="cwDate"></div>
  </div>
  <div id="pager"><div id="screens"></div></div>
  <div id="dots"></div>
  <div id="dock"></div>
</div>

<!-- 最近任务面板 -->
<div id="recents" class="panel">
  <div class="pHead"><span>最近任务</span>
    <span><button id="clearAll">全部清除</button><button id="closeR">▼ 收起</button></span></div>
  <div id="rCards"></div>
  <div class="rTip">上滑卡片清除单个 · 空白处下滑关闭 · 点击卡片回到应用</div>
</div>

<!-- 关于 / 系统更新 模态 -->
<div id="aboutMask" class="modalMask">
  <div class="modal" role="dialog" aria-label="关于">
    <div class="logoRow">
      <div class="logoBig">🚀</div>
      <div style="flex:1">
        <h2>__TITLE__</h2>
        <div class="ver"><span id="abVer">v__VERSION__</span>
          <span id="abRel">__RELEASED__</span></div>
      </div>
    </div>
    <div id="abUpd" class="updHint" style="display:none"></div>
    <div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;font-weight:500">📋 更新说明</div>
      <div class="cl"><ul>__CHANGELOG_HTML__</ul></div>
    </div>
    <div class="foot">
      <button class="btnDef" onclick="closeAbout()">关闭</button>
      <button class="btnPri" onclick="checkLauncherUpdate()">🔍 检查更新</button>
    </div>
  </div>
</div>

<div id="pages"></div>
<div id="homeBar"></div>

<script>
const LAUNCHER_VER = '__VERSION__';
const PAGE=16;
let APPS=[],pageIdx=0,screenCount=0,current=null,recentsOpen=false,suppress=false;
const pages={},openedOrder=[];
const $=id=>document.getElementById(id);

/* ── 工具 ─ */
function showToast(msg,dur){const d=document.createElement('div');d.className='__toast';
  d.textContent=msg;document.body.appendChild(d);
  setTimeout(()=>{d.style.transition='opacity 0.2s';d.style.opacity='0';
    setTimeout(()=>d.remove(),220);},(dur||1600));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clUL(text){if(!text)return'<li style="opacity:.4">暂无</li>';
  return String(text).split('\n').map(s=>s.trim().replace(/^[-•*]\s*/,'')).filter(Boolean)
    .map(s=>'<li>'+esc(s)+'</li>').join('')||'<li style="opacity:.4">暂无</li>';}

/* ── 时钟 / 网络 / 电量 / 问候语 ── */
function updateGreeting() {
  const h = new Date().getHours();
  let greet = '晚上好';
  if (h >= 5 && h < 12) greet = '早上好';
  else if (h >= 12 && h < 18) greet = '下午好';
  $('cwGreeting').textContent = greet + '，欢迎使用';
}

function tick(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  $('sbTime').textContent=p(d.getHours())+':'+p(d.getMinutes());
  $('cwTime').textContent=$('sbTime').textContent;
  $('cwDate').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`;
  updateGreeting();
}
tick(); setInterval(tick, 1000);

const setNet=()=>$('netIcon').classList.toggle('off',!navigator.onLine);
addEventListener('online',setNet);addEventListener('offline',setNet);setNet();
if(navigator.getBattery)navigator.getBattery().then(b=>{
  const up=()=>{$('battFill').style.width=(b.level*100)+'%';
    $('battFill').style.background=b.charging?'#fbbf24':'var(--success)';
    $('battPct').textContent=Math.round(b.level*100)+'%'+(b.charging?' ⚡':'');};
  up();b.addEventListener('levelchange',up);b.addEventListener('chargingchange',up);});

/* ─ 桌面构建 ── */
function buildHome(){
  const homeApps=APPS.filter(a=>!a.dock);
  const cols = Math.max(4, Math.floor(($('screens').clientWidth - 80) / 142)); 
  const itemsPerPage = cols * 3;
  screenCount=Math.max(1,Math.ceil(homeApps.length/itemsPerPage));
  
  const sc=$('screens');sc.innerHTML='';
  for(let s=0;s<screenCount;s++){
    const d=document.createElement('div');d.className='screen';
    homeApps.slice(s*itemsPerPage,(s+1)*itemsPerPage).forEach(a=>d.appendChild(iconEl(a)));
    sc.appendChild(d);}
    
  const dk=$('dock');dk.innerHTML='';
  APPS.filter(a=>a.dock).forEach(a=>dk.appendChild(iconEl(a)));
  
  const dots=$('dots');dots.innerHTML='';
  for(let i=0;i<screenCount;i++)dots.appendChild(document.createElement('i'));
  gotoPage(0);updateDots();}

function iconEl(a){
  const d=document.createElement('div');d.className='icon';d.dataset.id=a.id;
  const sys=a.system?'<div class="tile system" style="--c:'+a.color+'">'+a.icon+'</div>':
    '<div class="tile" style="--c:'+a.color+'">'+a.icon+'</div>';
  d.innerHTML=sys+'<div class="name">'+esc(a.name)+'</div>';return d;}

function gotoPage(i){
  pageIdx=Math.max(0,Math.min(screenCount-1,i));
  $('screens').style.transform=`translateX(${-pageIdx*$('pager').clientWidth}px)`;
  [...$('dots').children].forEach((d,j)=>d.classList.toggle('on',j===pageIdx));}
  
addEventListener('resize',()=>{
  gotoPage(pageIdx);
  buildHome(); 
});

function updateDots(){
  const run={};APPS.forEach(a=>run[a.id]=a.running);
  document.querySelectorAll('.icon').forEach(el=>{
    const tile=el.querySelector('.tile');
    if(tile){tile.classList.toggle('running',!!run[el.dataset.id]);
      tile.classList.toggle('system',!!APPS.find(a=>a.id===el.dataset.id&&a.system));}});}

/* ── 打开/关闭应用 ── */
async function openApp(a){
  let pg=pages[a.id];if(!pg){
    pg=document.createElement('div');pg.className='page';
    const isBg=!a.cmd||(a.cmd&&a.port==null);
    if(isBg){
      pg.innerHTML=`<div class="bar"><span>${esc(a.icon)} ${esc(a.name)}</span>
        <span><button onclick="goHome()"> 回桌面</button>
        <button onclick="killApp('${a.id}')">✕ 退出</button></span></div>
        <div class="loading">正在启动 ${esc(a.name)}…</div>
        <div style="text-align:center;margin-top:40px;color:var(--text-secondary)">${esc(a.name)} 后台运行中</div>`;
    }else{
      pg.innerHTML=`<div class="bar"><span>${esc(a.icon)} ${esc(a.name)}</span>
        <span><button onclick="goHome()">🏠 回桌面</button>
        <button onclick="killApp('${a.id}')">✕ 退出</button></span></div>
        <div class="loading">正在拉起进程，等待端口就绪…</div>
        <iframe allow="modals" style="display:none"></iframe><div class="gz"></div>`;
    }
    document.body.appendChild(pg);pages[a.id]=pg;openedOrder.push(a.id);}
  pg.classList.add('show');$('home').classList.add('dim');current=a.id;
  const wasRunning=a.running;
  const j=await (await fetch('/api/open?id='+a.id)).json();
  const iframe=pg.querySelector('iframe'),ld=pg.querySelector('.loading');
  if(j.url){
    if(j.ok&&(!wasRunning||!iframe.src)){
      iframe.src=j.url+(j.url.includes('?')?'&':'?')+'t='+Date.now();
      iframe.onload=()=>{ld.style.display='none';iframe.style.display='block';};
    }else{ld.style.display='none';iframe.style.display='block';}
  }else{ ld.style.display='none'; }
  poll();}

function goHome(){if(recentsOpen)return closeRecents();
  if(!current)return;pages[current].classList.remove('show');
  $('home').classList.remove('dim');current=null;}

async function killApp(id){
  const card=document.querySelector(`#rCards .card[data-id="${id}"]`);
  if(card){card.classList.add('fadeOut');}
  try{await fetch('/api/close?id='+id);}catch(e){}
  if(pages[id]){
    const iframe=pages[id].querySelector('iframe');
    if(iframe){
      const done=new Promise(res=>{
        iframe.onload=()=>{iframe.remove();res();};
        iframe.src='about:blank';
        setTimeout(res,300);
      });
      await done;
    }
    pages[id].style.display='none';
    setTimeout(()=>{
      if(pages[id]&&!pages[id].parentElement)return;
      if(pages[id]){pages[id].remove();delete pages[id];}
      const idx=openedOrder.indexOf(id);if(idx>=0)openedOrder.splice(idx,1);
      if(current===id){current=null;$('home').classList.remove('dim');}
      if(recentsOpen)renderRecents();poll();},50);
  }else{
    const idx=openedOrder.indexOf(id);if(idx>=0)openedOrder.splice(idx,1);
    if(current===id){current=null;$('home').classList.remove('dim');}
    if(recentsOpen)renderRecents();poll();}
}

/* ── 最近任务 ── */
function openRecents(){recentsOpen=true;renderRecents();$('recents').classList.add('show');}
function closeRecents(){recentsOpen=false;$('recents').classList.remove('show');}
function renderRecents(){
  const box=$('rCards');box.innerHTML='';
  if(!openedOrder.length){box.innerHTML='<div class="rEmpty">没有运行中的应用</div>';return;}
  openedOrder.slice().reverse().forEach(id=>{
    const a=APPS.find(x=>x.id===id);if(!a)return;
    const c=document.createElement('div');c.className='card';c.dataset.id=id;
    c.innerHTML=`<button class="x">✕</button>
      <div class="tile" style="--c:${a.color}">${a.icon}</div>
      <div class="name">${esc(a.name)}</div><div class="st">${a.running?'进程运行中':'页面保活中'}</div>`;
    let sy=null,mvY=0;
    c.addEventListener('pointerdown',e=>{sy=e.clientY;c.setPointerCapture(e.pointerId);c.style.transition='none';});
    c.addEventListener('pointermove',e=>{if(sy==null)return;mvY=e.clientY-sy;if(mvY<0)c.style.transform=`translateY(${mvY}px)`;});
    c.addEventListener('pointerup',e=>{
      if(sy==null)return;const dy=mvY;mvY=0;sy=null;c.style.transition='';c.style.transform='';
      if(dy<-60){killApp(id);return;}
      if(Math.abs(dy)<6)c.click();});
    c.onclick=()=>{if(suppress)return;closeRecents();openApp(a);};
    c.querySelector('.x').onclick=e=>{e.stopPropagation();killApp(id);};
    box.appendChild(c);});}

$('clearAll').onclick=async ()=>{
  const n=openedOrder.length;if(!n)return;
  if(!confirm(`确定关闭所有 ${n} 个运行中的应用？（进程将被回收）`))return;
  const all=[...openedOrder];
  for(const id of all){
    if(pages[id]){
      const iframe=pages[id].querySelector('iframe');
      if(iframe){iframe.src='about:blank';}
      pages[id].style.display='none';
    }
  }
  await new Promise(r=>setTimeout(r,250));
  for(const id of all){ try{await fetch('/api/close?id='+id);}catch(e){} }
  setTimeout(()=>{
    for(const id of all){ if(pages[id]){pages[id].remove();delete pages[id];} }
    openedOrder.length=0;
    if(current){current=null;$('home').classList.remove('dim');}
    if(recentsOpen)renderRecents();
    poll();
    showToast(`已关闭 ${all.length} 个后台进程`);},100);};
$('closeR').onclick=closeRecents;

/* ── 全局手势 ── */
let drag=null;
addEventListener('pointerdown',e=>{
  if(e.target.closest('#homeBar,button,.bar,#statusbar,.card,.modalMask input,.modalMask button'))return;
  drag={x:e.clientX,y:e.clientY,dx:0,dy:0,axis:null};
  if(!recentsOpen&&e.target.setPointerCapture)e.target.setPointerCapture(e.pointerId);});
addEventListener('pointermove',e=>{
  if(!drag)return;drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;
  if(!drag.axis&&(Math.abs(drag.dx)>8||Math.abs(drag.dy)>8))
    drag.axis=Math.abs(drag.dx)>Math.abs(drag.dy)?'h':'v';
  if(!recentsOpen&&!current&&drag.axis==='h'){
    $('screens').style.transition='none';
    $('screens').style.transform=`translateX(${-pageIdx*$('pager').clientWidth+drag.dx}px)`;}});
addEventListener('pointerup',e=>{
  if(!drag)return;const{dx,dy,axis}=drag;drag=null;
  suppress=!!axis&&(Math.abs(dx)>8||Math.abs(dy)>8);
  if(recentsOpen){if(axis==='v'&&dy>70)closeRecents();return;}
  if(!current){
    if(axis==='v'&&dy<-60){openRecents();return;}
    if(axis==='h'){if(dx<-60)gotoPage(pageIdx+1);else if(dx>60)gotoPage(pageIdx-1);else gotoPage(pageIdx);}}
  else{if(axis==='v'&&dy<-50)openRecents();}});
document.addEventListener('click',e=>{
  if(suppress){suppress=false;return;}
  const ic=e.target.closest('.icon');if(!ic)return;
  const a=APPS.find(x=>x.id===ic.dataset.id);if(a)openApp(a);});
$('homeBar').onclick=()=>{if(recentsOpen)closeRecents();else openRecents();};
addEventListener('keydown',e=>{if(e.key==='Escape'){
  if($('aboutMask').classList.contains('show'))closeAbout();else goHome();}});

/* ── 关于模态 ── */
function openAbout(){$('aboutMask').classList.add('show');}
function closeAbout(){$('aboutMask').classList.remove('show');}
$('gearBtn').onclick=openAbout;
$('aboutMask').addEventListener('click',e=>{if(e.target.id==='aboutMask')closeAbout();});
async function checkLauncherUpdate(){
  const box=$('abUpd');box.style.display='block';box.className='updHint';
  box.textContent='正在检查更新…';
  try{const r=await fetch('/api/launcher/version');const d=await r.json();
    if(d.error){box.className='updHint up';box.innerHTML='⚠️ 连不上仓库：'+esc(d.error);return;}
    const rem=d.remote||'（无远端信息）';
    if(d.upgradable){
      box.className='updHint up';
      box.innerHTML=`<b>✨ 发现新版本</b><br>当前 v${esc(d.local)} → 最新 v${esc(rem)}<br>`+
        `<small style="color:var(--text-secondary)">发布时间：${esc(d.released_remote||'—')}</small><br>`+
        `<div style="margin-top:10px;padding:10px 14px;background:rgba(0,0,0,0.2);border-radius:8px;font-size:13px;border:1px solid var(--glass-border)">更新内容：<ul style="padding-left:18px;margin-top:6px">${clUL(d.changelog_remote)}</ul></div>`+
        `<button class="btnPri" style="margin-top:12px;padding:8px 16px" onclick="goUpdateFromAbout()">立即更新（跳转至系统信息）</button>`;
      $('gearBtn').classList.add('hasUpdate');
    }else{
      box.className='updHint ok';
      box.textContent=`✅ 当前已是最新版本（v${d.local}）。远端：${rem}`;
      $('gearBtn').classList.remove('hasUpdate');}}
  catch(e){box.className='updHint up';box.textContent='检查失败：'+e.message;}}
  
function goUpdateFromAbout(){
  closeAbout();
  const sysInfo=APPS.find(a=>a.id==='sysinfo');
  if(sysInfo){showToast('即将打开系统信息 → Launcher 更新');setTimeout(()=>openApp(sysInfo),400);}
  else{showToast('请打开系统信息应用（sysinfo）进行更新');}
}
setTimeout(()=>fetch('/api/launcher/version').then(r=>r.json()).then(d=>{
  if(d.upgradable)$('gearBtn').classList.add('hasUpdate');}).catch(()=>{}),1500);

/* ── 轮询 ── */
async function poll(){
  const prev=APPS.map(a=>a.id).join(',');
  APPS=await (await fetch('/api/apps')).json();
  const cur=APPS.map(a=>a.id).join(',');
  if(prev!==cur&&prev.length){buildHome();}
  updateDots();if(recentsOpen)renderRecents();}
poll().then(()=>{buildHome();setInterval(poll,2000);});
</script></body></html>
