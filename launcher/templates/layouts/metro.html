__SHARED_CSS__

/* ══════════════ 磁贴式布局（玻璃 Metro 版） ══════════════
   保留 Metro 式错落排布，磁贴 = 主色晕染 + 顶部高光 + 悬浮投影，
   入场依次弹出，运行指示带呼吸光点。 */

#home {
    padding: 48px 0 0;
    align-items: stretch;
}

/* 顶部时钟问候区 */
#cw { text-align:center; padding:6px 20px 20px; flex-shrink:0; }
#cwGreeting {
    font-size:13px; color:var(--text-secondary); margin-bottom:6px; font-weight:500;
    letter-spacing:3px; text-transform:uppercase;
}
#cwTime {
    font-size:56px; font-weight:200; letter-spacing:-2px; line-height:1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(to bottom, var(--clock-gradient-top) 12%, var(--clock-gradient-bottom) 92%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 14px rgba(0,0,0,0.22)) drop-shadow(0 0 34px var(--clock-glow));
}
#cwDate {
    font-size:12.5px; color:var(--text-secondary); margin-top:8px; font-weight:500;
    letter-spacing:0.8px;
}

/* 磁贴网格容器：响应式列数，铺满可用宽度 */
#tiles {
    flex:1; overflow-y:auto; overflow-x:hidden;
    display:grid;
    grid-template-columns: repeat(var(--cols, 6), 120px);
    grid-auto-rows: 120px;
    gap:10px;
    justify-content:center;
    align-content:start;
    padding:10px 28px 80px;
    touch-action:pan-y;
}

/* 磁贴基类：主色晕染 + 分层玻璃
   层次：外投影(悬浮) + 主色渐变底 + 顶部高光线 + 内侧微光 */
.icon {
    position:relative; overflow:hidden; cursor:pointer;
    border-radius:14px;
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    background:
        radial-gradient(circle at 32% 26%, color-mix(in srgb, var(--c) 72%, transparent) 0%, transparent 58%),
        linear-gradient(165deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 46%, rgba(255,255,255,0.01) 100%),
        color-mix(in srgb, var(--c) 30%, rgba(26,30,40,0.50));
    backdrop-filter: blur(18px) saturate(1.25); -webkit-backdrop-filter: blur(18px) saturate(1.25);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow:
        0 6px 14px rgba(0,0,0,0.22),
        0 1px 3px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 -14px 26px rgba(0,0,0,0.16);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s ease, border-color 0.22s ease;
    user-select:none;
    animation: tile-pop 0.5s cubic-bezier(0.22,1.2,0.36,1) backwards;
}
/* 悬停扫光 */
.icon::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
    transform: skewX(-25deg); transition: left 0.6s;
}
.icon:hover::before { left: 150%; }
/* 大磁贴 2x2：dock 应用 */
.icon.lg { grid-row:span 2; grid-column:span 2; border-radius:18px; }
/* 中磁贴 2x1：系统应用 */
.icon.md { grid-column:span 2; }

/* 居中大图标 */
.icon .ic {
    font-size:36px; line-height:1;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.32));
    pointer-events:none;
}
.icon.lg .ic { font-size:76px; }
.icon.md .ic { font-size:48px; }

/* 底部白色名称 */
.icon .name {
    position:absolute; left:10px; right:10px; bottom:8px;
    font-size:12px; color:#fff; font-weight:500;
    text-shadow: 0 1px 4px rgba(0,0,0,0.65), 0 0 12px rgba(0,0,0,0.3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-align:center;
    pointer-events:none;
}
.icon.lg .name { font-size:15px; left:14px; right:14px; bottom:14px; }

/* hover：明显上浮 + 主色光晕扩散 + 边框提亮 */
.icon:hover {
    transform: translateY(-5px) scale(1.02);
    border-color: rgba(255,255,255,0.26);
    box-shadow:
        0 18px 34px rgba(0,0,0,0.34),
        0 0 40px color-mix(in srgb, var(--c) 38%, transparent),
        inset 0 1px 0 rgba(255,255,255,0.28),
        inset 0 -14px 26px rgba(0,0,0,0.10);
    z-index:2;
}
.icon:active { transform: scale(0.96) translateY(-1px); transition: transform 0.08s; }

/* 运行中：右上角呼吸光点 */
.icon.running::after {
    content:""; position:absolute; top:9px; right:9px;
    width:8px; height:8px; border-radius:50%;
    background:#fff;
    box-shadow: 0 0 8px rgba(255,255,255,0.95), 0 0 18px rgba(255,255,255,0.55);
    z-index:3;
    animation: run-pulse 2.2s ease-in-out infinite;
}
.icon.lg.running::after { width:11px; height:11px; top:13px; right:13px; }
@keyframes run-pulse {
    0%, 100% { box-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 14px rgba(255,255,255,0.4); }
    50%      { box-shadow: 0 0 12px rgba(255,255,255,1), 0 0 26px rgba(255,255,255,0.75); }
}
</style>

<script>
/* ══════════════ 磁贴式布局专属 JS ══════════════ */

/* 磁贴列数参数 */
const METRO={TILE:120, GAP:10, PAD_X:28};

/* 根据 APPS 渲染磁贴：
   - dock 应用 → 大磁贴 2x2（置顶）
   - 系统应用 → 中磁贴 2x1（横向）
   - 普通应用 → 小磁贴 1x1
   _shared.js 在 poll().then() 后会自动调用 buildHome()。 */
function buildHome(){
  const box=$('tiles'); if(!box)return;
  const cols=Math.max(2, Math.floor((box.clientWidth-METRO.PAD_X*2+METRO.GAP)/(METRO.TILE+METRO.GAP)));
  box.style.setProperty('--cols', cols);
  box.innerHTML='';

  let idx=0;
  APPS.filter(a=>a.dock).forEach(a=>box.appendChild(tileEl(a,'lg',idx++)));
  APPS.filter(a=>a.system && !a.dock).forEach(a=>box.appendChild(tileEl(a,'md',idx++)));
  APPS.filter(a=>!a.dock && !a.system).forEach(a=>box.appendChild(tileEl(a,'',idx++)));

  if(typeof updateDots==='function')updateDots();
}

/* 构造单个磁贴：class="icon[ lg|md]" data-id=应用id，inline 设置 --c 为应用 color */
function tileEl(a, size, idx){
  const d=document.createElement('div');
  d.className='icon'+(size?(' '+size):'');
  d.dataset.id=a.id;
  d.style.setProperty('--c', a.color||'#555');
  /* 入场依次弹出（上限 24 项，避免长列表等待） */
  d.style.animationDelay=Math.min(idx,24)*22+'ms';
  if(a.system)d.classList.add('system');
  d.innerHTML='<span class="ic">'+a.icon+'</span><span class="name">'+esc(a.name)+'</span>';
  return d;
}

/* 运行状态：给运行中磁贴加 .running 类（右上角呼吸光点） */
function updateDots(){
  const run={};APPS.forEach(a=>run[a.id]=a.running);
  document.querySelectorAll('#tiles .icon').forEach(el=>{
    el.classList.toggle('running',!!run[el.dataset.id]);
  });
}

/* 窗口尺寸变化时重建（保持网格列数自适应） */
addEventListener('resize',()=>{ if(typeof buildHome==='function')buildHome(); });
</script></body></html>
