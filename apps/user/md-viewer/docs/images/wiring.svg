<?xml version="1.0" encoding="UTF-8"?>
<!-- ENV-100 接线示意图：8 位端子与典型外设连接 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#2e3440"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="360" fill="#f8f9fa"/>

  <!-- 设备主体 -->
  <rect x="60" y="40" width="640" height="180" rx="10" fill="url(#body)" stroke="#1f2430" stroke-width="2"/>
  <text x="380" y="70" text-anchor="middle" fill="#eceff4" font-size="20" font-weight="bold">ENV-100 智能环境监测节点</text>
  <circle cx="92" cy="62" r="6" fill="#10b981"/>
  <text x="104" y="67" fill="#d8dee9" font-size="11">PWR</text>
  <circle cx="150" cy="62" r="6" fill="#f59e0b">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="162" y="67" fill="#d8dee9" font-size="11">RUN</text>

  <!-- 传感器示意 -->
  <g font-size="11" fill="#d8dee9">
    <rect x="470" y="92" width="200" height="92" rx="6" fill="#434c5e" stroke="#5e81ac"/>
    <text x="570" y="112" text-anchor="middle" font-weight="bold">传感器阵列</text>
    <text x="486" y="134">温度 · 湿度 · 气压</text>
    <text x="486" y="152">CO₂ · PM2.5 / PM10</text>
    <text x="486" y="170">光照 · 噪声</text>
  </g>

  <!-- 端子排 -->
  <rect x="90" y="200" width="560" height="28" fill="#d8dee9" stroke="#1f2430" stroke-width="1.5"/>
  <g font-size="11" fill="#1f2430" font-weight="bold" text-anchor="middle">
    <text x="125" y="218">1</text><text x="195" y="218">2</text><text x="265" y="218">3</text>
    <text x="335" y="218">4</text><text x="405" y="218">5</text><text x="475" y="218">6</text>
    <text x="545" y="218">7</text><text x="615" y="218">8</text>
  </g>
  <g fill="#2e3440">
    <circle cx="125" cy="228" r="4"/><circle cx="195" cy="228" r="4"/><circle cx="265" cy="228" r="4"/>
    <circle cx="335" cy="228" r="4"/><circle cx="405" cy="228" r="4"/><circle cx="475" cy="228" r="4"/>
    <circle cx="545" cy="228" r="4"/><circle cx="615" cy="228" r="4"/>
  </g>

  <!-- 引线与外设 -->
  <g stroke-width="2" fill="none">
    <!-- 1/2 电源 -->
    <path d="M125,232 L125,280 L40,280 L40,300" stroke="#ef4444"/>
    <path d="M195,232 L195,280 L70,280 L70,300" stroke="#374151"/>
    <!-- 3/4 RS485 -->
    <path d="M265,232 L265,290 L200,290 L200,300" stroke="#3b82f6"/>
    <path d="M335,232 L335,290 L230,290 L230,300" stroke="#3b82f6"/>
    <!-- 5 DO -->
    <path d="M405,232 L405,300" stroke="#8b5cf6"/>
    <!-- 6 DI -->
    <path d="M475,232 L475,300" stroke="#10b981"/>
    <!-- 7 ALARM -->
    <path d="M545,232 L545,300" stroke="#f59e0b"/>
    <!-- 8 SHIELD -->
    <path d="M615,232 L615,300" stroke="#6b7280"/>
  </g>

  <!-- 标签 -->
  <g font-size="11" fill="#1f2430" text-anchor="middle">
    <text x="55" y="316">VCC</text><text x="85" y="316">12V</text>
    <text x="215" y="316">RS485-A</text>
    <text x="245" y="316">RS485-B</text>
    <text x="405" y="316">DO-1</text>
    <text x="475" y="316">DI-1</text>
    <text x="545" y="316">ALARM</text>
    <text x="615" y="316">SHIELD</text>
  </g>

  <!-- 外设框 -->
  <g font-size="11" fill="#1f2430" text-anchor="middle">
    <rect x="20" y="300" width="80" height="40" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="60" y="324">12V 电源</text>
    <rect x="170" y="300" width="80" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="210" y="320">RS485</text><text x="210" y="334">上位机</text>
    <rect x="360" y="300" width="90" height="40" rx="4" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="405" y="324">继电器 / 负载</text>
    <rect x="440" y="300" width="70" height="40" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="475" y="324">门磁 / 开关</text>
    <rect x="510" y="300" width="70" height="40" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="545" y="324">报警器</text>
    <rect x="585" y="300" width="60" height="40" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="615" y="324">接地</text>
  </g>
</svg>
