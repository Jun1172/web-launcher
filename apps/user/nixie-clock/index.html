<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📺 辉光管时钟</title><style>:root{--glow:#fb923c}body{margin:0;background:#09090b;color:var(--glow);font-family:Georgia,serif;text-align:center}main{margin:12vh auto}.tube{display:inline-block;padding:18px 12px;border:2px solid #431407;border-radius:18px;background:#18181b;font:clamp(44px,14vw,110px) monospace;text-shadow:0 0 12px var(--glow),0 0 34px var(--glow);box-shadow:0 0 30px #7c2d12 inset,0 0 20px #7c2d12}.sub{font:18px system-ui;margin:25px}button{padding:9px 15px;margin:4px;border:1px solid var(--glow);border-radius:7px;background:#18181b;color:var(--glow)}</style><main><h1>📺 NIXIE TIME</h1><div class="tube" id="clock"></div><div class="sub" id="date"></div><button onclick="mode='time'">时间</button><button onclick="mode='date'">日期</button><button onclick="mode='stop'">秒表</button><button onclick="color()">换色</button></main><script>let mode='time',sw=0,colors=['#fb923c','#38bdf8','#4ade80'],ci=0;function color(){ci=(ci+1)%3;document.documentElement.style.setProperty('--glow',colors[ci])}function render(){let d=new Date();if(mode==='time')clock.textContent=d.toLocaleTimeString('zh-CN',{hour12:false});if(mode==='date')clock.textContent=d.toLocaleDateString('zh-CN').replaceAll('/','.');if(mode==='stop')clock.textContent=((Date.now()-sw)/1000).toFixed(1).padStart(6,'0');date.textContent=mode==='stop'?'点击“秒表”后重新计时':d.toLocaleDateString('zh-CN',{weekday:'long'})}setInterval(render,100);document.querySelector('[onclick="mode=\'stop\'"]').onclick=()=>{sw=Date.now();mode='stop'};render()</script>
