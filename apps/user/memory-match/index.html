<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎯 记忆翻牌</title><style>body{margin:0;background:#fff7ed;color:#431407;font:16px system-ui;text-align:center}main{max-width:430px;margin:5vh auto;padding:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{aspect-ratio:1;border:0;border-radius:12px;background:#fb923c;color:white;font-size:30px}.card.open{background:#fed7aa;color:#7c2d12}.cursor{outline:4px solid #0ea5e9}button{padding:9px 16px;border:0;border-radius:7px;background:#ea580c;color:#fff}</style><main><h1>🎯 记忆翻牌</h1><p id="info">方向键移动 · Enter 翻牌</p><div class="grid" id="grid"></div><button onclick="reset()">重开</button></main><script>let cards,cur,open,lock,moves;const icons=['🍎','🚀','🌙','⚙️','🎵','🌈','🐳','⭐'];function reset(){cards=[...icons,...icons].sort(()=>Math.random()-.5);cur=0;open=[];lock=false;moves=0;render()}function flip(){if(lock||open.includes(cur))return;open.push(cur);moves++;render();if(open.length===2){lock=true;setTimeout(()=>{if(cards[open[0]]!==cards[open[1]])open=[];else if(document.querySelectorAll('.done').length===16)info.textContent='完成！共 '+moves+' 步';lock=false;render()},650)}}function render(){grid.innerHTML=cards.map((v,i)=>`<button class="card ${open.includes(i)?'open':''} ${i===cur?'cursor':''} ${open.includes(i)?'done':''}" onclick="cur=${i};flip()">${open.includes(i)?v:'?'}</button>`).join('')}addEventListener('keydown',e=>{let r=Math.floor(cur/4),c=cur%4;if(e.key==='ArrowUp')r=(r+3)%4;if(e.key==='ArrowDown')r=(r+1)%4;if(e.key==='ArrowLeft')c=(c+3)%4;if(e.key==='ArrowRight')c=(c+1)%4;cur=r*4+c;if(e.key==='Enter'||e.key===' ')flip();render()});reset()</script>
