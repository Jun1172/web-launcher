<!DOCTYPE html><html lang="zh-CN" data-theme="__THEME__"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>__TITLE__</title>
<style>
__SHARED_CSS__

/* ══════════════ 九宫格布局（全屏玻璃桌面版） ══════════════
   视觉参考：图标直接铺在极光背景上，Dock 浮底，无中央灰色面板 */

#home {
    padding: 48px 0 0;
    align-items: center;
}

/* 全屏内容区：承载时钟、图标网格与 Dock */
#desktop {
    flex: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0 24px 12px;
    overflow: hidden;
}

/* 大时钟区 */
#cw {
    text-align: center;
    margin-bottom: 22px;
    padding: 0 20px;
    flex-shrink: 0;
}
#cwGreeting {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}
#cwTime {
    font-size: 92px;
    font-weight: 300;
    letter-spacing: -3px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(to bottom, var(--clock-gradient-top) 0%, var(--clock-gradient-bottom) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.35)) drop-shadow(0 0 40px var(--clock-glow));
}
#cwDate {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
    font-weight: 500;
    letter-spacing: 0.5px;
}

/* 分页容器 */
#pager {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
#screens {
    display: flex;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
}

/* 核心布局：响应式网格（列数由 JS 统一计算后以 inline style 应用） */
.screen {
    flex: 0 0 100%;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 18px;
    align-content: center;
    justify-items: center;
    padding: 0 40px;
    overflow: hidden;
}

.icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    position: relative;
    width: 92px;
}
.tile {
    position: relative;
    width: 68px;
    height: 68px;
    border-radius: var(--tile-radius);
    font-size: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--glass-bg);
    background:
        radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--c) 42%, transparent) 0%, transparent 65%),
        linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--tile-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
}
.tile::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    transform: skewX(-25deg); transition: left 0.55s;
}
.icon:hover .tile::before { left: 150%; }
.icon:hover .tile {
    background: var(--glass-bg-hover);
    background:
        radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--c) 60%, transparent) 0%, transparent 60%),
        linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 100%);
    border-color: var(--glass-border-hover);
    transform: translateY(-6px) scale(1.08);
    box-shadow: var(--tile-shadow-hover), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    box-shadow: var(--tile-shadow-hover), 0 0 28px color-mix(in srgb, var(--c) 35%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.icon:active .tile { transform: scale(0.95); transition: transform 0.1s; }

.name {
    font-size: 12px;
    color: var(--text-primary);
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    padding: 0 2px;
    font-weight: 500;
    letter-spacing: 0.3px;
}
.tile.running::after {
    content: "";
    position: absolute;
    bottom: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 10px var(--success);
}
.tile.system::after {
    content: "";
    position: absolute;
    top: 6px;
    right: 6px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
    z-index: 2;
}

/* 分页指示器 */
#dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 18px 0 8px;
    flex-shrink: 0;
}
#dots i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dot-bg);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#dots i.on {
    background: var(--dot-on-bg);
    width: 26px;
    border-radius: 3px;
    box-shadow: 0 0 12px var(--dot-on-glow);
}

/* 底部 Dock */
#dock {
    margin: 0 auto 24px;
    height: 72px;
    border-radius: var(--dock-radius);
    background: var(--dock-bg);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--dock-border);
    box-shadow: var(--dock-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 0 20px;
    max-width: 88%;
}
#dock .icon { width: auto; }
#dock .tile {
    width: 54px;
    height: 54px;
    font-size: 28px;
    border-radius: 16px;
}
#dock .icon:hover .tile {
    transform: translateY(-10px) scale(1.22);
}
#dock .name { display: none; }
</style>
__THEME_BLOCKS__
</head><body>

<div id="statusbar">
  <span id="sbTime" style="font-variant-numeric: tabular-nums;">--:--</span>
  <span class="sbR">
    <button id="layoutBtn" title="布局编辑">🗂️</button>
    <svg id="netIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

      <path class="arc" d="M5.5 12.5c2-1.8 4.2-2.7 6.5-2.7s4.5.9 6.5 2.7"/>
      <path class="arc" d="M9 16.3c1-.9 2-1.3 3-1.3s2 .4 3 1.3"/>
      <circle cx="12" cy="19.5" r="1.8" fill="currentColor" stroke="none"/>
      <path class="slash" d="M4 4l16 16"/>
    </svg>
    <span id="batt"><i id="battFill"></i><b></b></span><span id="battPct" style="font-size:11px;margin-left:4px;color:var(--text-secondary);font-variant-numeric:tabular-nums;"></span>
  </span>
</div>

<div id="home">
  <div id="desktop">
    <div id="cw">
      <div id="cwGreeting">欢迎使用</div>
      <div id="cwTime">--:--</div>
      <div id="cwDate"></div>
    </div>
    <div id="pager"><div id="screens"></div></div>
    <div id="dots"></div>
    <div id="dock"></div>
  </div>
</div>

<!-- 最近任务面板 -->
<div id="recents" class="panel">
  <div class="pHead"><span>最近任务</span>
    <span><button id="clearAll">全部清除</button><button id="closeR">收起</button></span></div>

  <div class="rTip">上滑卡片清除单个 · 空白处下滑关闭 · 点击卡片回到应用</div>
</div>

<!-- 布局编辑模态 -->
<div id="layoutMask" class="modalMask">
  <div class="modal" role="dialog" aria-label="布局编辑">
    <h2>布局编辑</h2>
    <div style="font-size:13px;color:var(--text-secondary);line-height:1.6">
      切换桌面布局风格与配色；勾选 <b style="color:var(--text-primary)">Dock</b> 常驻底部，勾选 <b style="color:var(--danger)">隐藏</b> 从桌面移除。修改后保存即时生效。
    </div>
    <div class="layoutRow">
      <div class="themeLabel">布局风格</div>
      <div id="layoutPicker" class="layoutList"></div>
    </div>
    <div class="themeRow">
      <div class="themeLabel">桌面风格</div>
      <div id="themeList" class="themeList"></div>
    </div>
    <div id="layList" class="layList"></div>
    <div class="foot">
      <button class="btnDef" onclick="closeLayout()">取消</button>
      <button class="btnPri" onclick="saveLayout()">保存</button>
    </div>
  </div>
</div>

<div id="pages"></div>
<div id="homeBar"></div>

<script>

<script>
/* ══════════════ 九宫格布局专属 JS ══════════════ */
let pageIdx=0, screenCount=0;

/* 列数/行数只在此处计算，再 inline 应用到每个 .screen 的
   grid-template-columns —— 与 CSS 的 padding/gap/最小列宽用同一套参数，
   保证每页图标容量 = 实际能排下的容量，窗口拉伸时不会错页混排。 */
const GRID={PAD_X:40, GAP:18, COL_MIN:92, ROW_H:96}; // ROW_H: tile 68 + gap 10 + name ~18

function buildHome(){
  const homeApps=APPS.filter(a=>!a.dock);
  const pager=$('pager');
  const availW=Math.max(GRID.COL_MIN, pager.clientWidth-GRID.PAD_X*2);
  const cols=Math.max(1, Math.floor((availW+GRID.GAP)/(GRID.COL_MIN+GRID.GAP)));
  const availH=Math.max(GRID.ROW_H, pager.clientHeight);
  const rows=Math.max(1, Math.floor((availH+GRID.GAP)/(GRID.ROW_H+GRID.GAP)));
  const itemsPerPage=Math.max(1, cols*rows);
  screenCount=Math.max(1,Math.ceil(homeApps.length/itemsPerPage));

  const sc=$('screens');sc.innerHTML='';
  for(let s=0;s<screenCount;s++){
    const d=document.createElement('div');d.className='screen';
    d.style.gridTemplateColumns='repeat('+cols+',1fr)';
    homeApps.slice(s*itemsPerPage,(s+1)*itemsPerPage).forEach(a=>d.appendChild(iconEl(a)));
    sc.appendChild(d);}

  const dk=$('dock');dk.innerHTML='';
  APPS.filter(a=>a.dock).forEach(a=>dk.appendChild(iconEl(a)));

  const dots=$('dots');dots.innerHTML='';
  for(let i=0;i<screenCount;i++)dots.appendChild(document.createElement('i'));
  gotoPage(0);updateDots();}

function iconEl(a){
  const d=document.createElement('div');d.className='icon';d.dataset.id=a.id;
  const sys=a.system?'<div class="tile system" style="--c:'+a.color+'">'+a.icon+'</div>':
    '<div class="tile" style="--c:'+a.color+'">'+a.icon+'</div>';
  d.innerHTML=sys+'<div class="name">'+esc(a.name)+'</div>';return d;}

function gotoPage(i){
  pageIdx=Math.max(0,Math.min(screenCount-1,i));
  $('screens').style.transform=`translateX(${-pageIdx*$('pager').clientWidth}px)`;
  [...$('dots').children].forEach((d,j)=>d.classList.toggle('on',j===pageIdx));}

addEventListener('resize',()=>{ if(typeof buildHome==='function')buildHome(); });

function updateDots(){
  const run={};APPS.forEach(a=>run[a.id]=a.running);
  document.querySelectorAll('.icon').forEach(el=>{
    const tile=el.querySelector('.tile');
    if(tile){tile.classList.toggle('running',!!run[el.dataset.id]);
      tile.classList.toggle('system',!!APPS.find(a=>a.id===el.dataset.id&&a.system));}});}

/* ── 分页拖动跟手（响应 _shared.js 的 onDragH/onSwipeH 约定） ── */
function onDragH(dx){
  $('screens').style.transition='none';
  $('screens').style.transform=`translateX(${-pageIdx*$('pager').clientWidth+dx}px)`;
}
function onDragHReset(){ $('screens').style.transition=''; }
function onSwipeH(dx){
  if(dx<-60)gotoPage(pageIdx+1);
  else if(dx>60)gotoPage(pageIdx-1);
  else gotoPage(pageIdx);
}
</script></body></html>
